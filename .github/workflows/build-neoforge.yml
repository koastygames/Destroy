name: Build Destroy NeoForge 1.21.1

on:
  push:
    branches:
      - chatgpt/update-neoforge-create-2026-08-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install local Petrolpark dependencies
        shell: bash
        run: |
          set -euo pipefail

          MC_VERSION="$(grep '^minecraft_version[[:space:]]*=' gradle.properties | cut -d= -f2- | xargs)"
          PETROLPARK_VERSION="$(grep '^petrolpark_library_version[[:space:]]*=' gradle.properties | cut -d= -f2- | xargs)"
          PQUALITY_VERSION="$(grep '^pquality_version[[:space:]]*=' gradle.properties | cut -d= -f2- | xargs)"

          download_modrinth_primary() {
            local project="$1"
            local version_number="$2"
            local output="$3"

            echo "Downloading ${project} ${version_number}"
            local json
            json="$(curl --retry 5 --retry-delay 2 --fail --silent --show-error \
              "https://api.modrinth.com/v2/project/${project}/version")"

            local url
            url="$(printf '%s' "$json" | jq -r --arg version "$version_number" \
              '[.[] | select(.version_number == $version)][0].files | ((map(select(.primary == true))[0] // .[0]) | .url)')"

            if [[ -z "$url" || "$url" == "null" ]]; then
              echo "Could not find ${project} version ${version_number} on Modrinth" >&2
              exit 1
            fi

            curl --retry 5 --retry-delay 2 --fail --location --show-error "$url" --output "$output"
          }

          download_modrinth_primary "petrolpark" "${MC_VERSION}-${PETROLPARK_VERSION}" /tmp/petrolpark.jar
          mvn --batch-mode --quiet install:install-file \
            -Dfile=/tmp/petrolpark.jar \
            -DgroupId=petrolpark.mc.library \
            -DartifactId="petrolpark-${MC_VERSION}" \
            -Dversion="${PETROLPARK_VERSION}" \
            -Dpackaging=jar \
            -DgeneratePom=true

          download_modrinth_primary "pquality" "${MC_VERSION}-${PQUALITY_VERSION}" /tmp/pquality.jar
          mvn --batch-mode --quiet install:install-file \
            -Dfile=/tmp/pquality.jar \
            -DgroupId=petrolpark.mc.pquality \
            -DartifactId=pquality \
            -Dversion="${PQUALITY_VERSION}" \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Collect distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh artifact/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: destroy-neoforge-1.21.1
          path: artifact/*.jar
          if-no-files-found: error
          retention-days: 30
